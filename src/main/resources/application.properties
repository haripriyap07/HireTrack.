spring.application.name=hiretrack

# Datasource configuration with fallback options
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${JDBC_DATABASE_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${JDBC_DATABASE_PASSWORD}}

# Driver explicitly set (recommended for Docker containers)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Render dynamically passes PORT. Fallback to 9091 for local dev.
server.port=${PORT:10000}

# JWT signing secret
app.jwt.secret=${JWT_SECRET:hiretracksecretkeyhiretracksecretkey}

# Resume upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
