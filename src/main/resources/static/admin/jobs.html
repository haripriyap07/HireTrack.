<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Jobs - HireTrack</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="app-body"><div id="navbarMount"></div><section class="page-section"><div class="container"><div class="page-header"><div><p class="eyebrow">Administration</p><h1>Job Management</h1></div></div><div id="jobs" class="panel panel-body"><div class="loading">Loading jobs...</div></div></div></section>
<script src="/js/main.js"></script><script>
if(!requireAuth()) throw new Error('auth'); const u=getStoredUser(); if(normalizeRole(u.role)!=='ADMIN'){location.href=getDashboardPath(u.role);} initNavbar('jobs');
async function load(){try{const jobs=await apiCall('/api/jobs/all','GET',null,true); document.getElementById('jobs').innerHTML=jobs.length?jobs.map(j=>`<article class="job-item"><div class="job-item-header"><div><h3>${j.title||'Untitled'}</h3><p class="job-meta">${j.company||''} • ${j.location||''} • Recruiter: ${j.recruiterEmail||'—'}</p><p>${j.skills||'No skills specified'}</p></div><span class="status-badge">${j.active?'Active':'Closed'}</span></div><div class="job-actions">${j.active?`<button class="btn btn-secondary btn-small" onclick="toggleJob(${j.id},false)">Close</button>`:`<button class="btn btn-secondary btn-small" onclick="toggleJob(${j.id},true)">Reopen</button>`}<button class="btn btn-secondary btn-small" onclick="deleteJob(${j.id})">Delete</button></div></article>`).join(''):'<div class="empty-state">No jobs found.</div>';}catch(e){document.getElementById('jobs').innerHTML=`<div class="error-state">${e.message}</div>`;}}
async function toggleJob(id,open){try{await apiCall(`/api/jobs/${id}/${open?'reopen':'close'}`,'PUT',null,true);load();}catch(e){showToast(e.message,'error');}}
async function deleteJob(id){if(!confirm('Delete this job?'))return;try{await apiCall('/api/jobs/'+id,'DELETE',null,true);load();}catch(e){showToast(e.message,'error');}}
load();</script></body></html>
