<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Dashboard - HireTrack</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="app-body"><div id="navbarMount"></div><section class="page-section"><div class="container"><div class="page-header"><div><p class="eyebrow">Administration</p><h1>Admin Dashboard</h1><p class="subtitle">Monitor users, jobs and applications across HireTrack.</p></div></div><div id="stats" class="stats-grid"><div class="loading">Loading statistics...</div></div><div class="panel"><div class="panel-body"><div class="header-actions"><a class="btn btn-primary" href="/admin/users.html">Manage Users</a><a class="btn btn-secondary" href="/admin/jobs.html">Manage Jobs</a><a class="btn btn-secondary" href="/admin/applications.html">View Applications</a></div></div></div></div></section>
<script src="/js/main.js"></script><script>
if(!requireAuth()) throw new Error('auth'); const u=getStoredUser(); if(normalizeRole(u.role)!=='ADMIN'){location.href=getDashboardPath(u.role);} initNavbar('dashboard');
(async()=>{try{const s=await apiCall('/api/jobs/stats/admin','GET',null,true); const c=s.counts||{}; document.getElementById('stats').innerHTML=[['Total Users','TOTAL_USERS'],['Candidates','CANDIDATES'],['Recruiters','RECRUITERS'],['Jobs','TOTAL_JOBS'],['Applications','TOTAL_APPLICATIONS']].map(x=>`<article class="stat-card"><span class="stat-label">${x[0]}</span><strong class="stat-value">${c[x[1]]||0}</strong></article>`).join('');}catch(e){document.getElementById('stats').innerHTML=`<div class="error-state">${e.message}</div>`;}})();
</script></body></html>
