<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Applications - HireTrack</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="app-body"><div id="navbarMount"></div><section class="page-section"><div class="container"><div class="page-header"><div><p class="eyebrow">Administration</p><h1>All Applications</h1></div></div><div id="apps" class="panel panel-body"><div class="loading">Loading applications...</div></div></div></section>
<script src="/js/main.js"></script><script>
if(!requireAuth()) throw new Error('auth'); const u=getStoredUser(); if(normalizeRole(u.role)!=='ADMIN'){location.href=getDashboardPath(u.role);} initNavbar('applications');
async function load(){try{const apps=await apiCall('/api/applications','GET',null,true); document.getElementById('apps').innerHTML=apps.length?`<div style="overflow:auto"><table class="data-table"><thead><tr><th>Candidate</th><th>Job</th><th>Status</th><th>Match</th><th>Resume</th><th>Applied</th></tr></thead><tbody>${apps.map(a=>`<tr><td>${a.applicantName||''}<br><small>${a.applicantEmail||''}</small></td><td>${a.jobTitle||'Job #'+a.jobId}</td><td>${formatStatus(a.status)}</td><td>${a.matchScore!=null?a.matchScore+'%':'—'}</td><td>${a.resumeUrl?`<a href="${a.resumeUrl}" target="_blank">View</a>`:'—'}</td><td>${formatDate(a.appliedDate)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state">No applications found.</div>';}catch(e){document.getElementById('apps').innerHTML=`<div class="error-state">${e.message}</div>`;}}
load();</script></body></html>
