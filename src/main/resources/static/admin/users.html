<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Users - HireTrack</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="app-body"><div id="navbarMount"></div><section class="page-section"><div class="container"><div class="page-header"><div><p class="eyebrow">Administration</p><h1>User Management</h1></div></div><div id="users" class="panel panel-body"><div class="loading">Loading users...</div></div></div></section>
<script src="/js/main.js"></script><script>
if(!requireAuth()) throw new Error('auth'); const u=getStoredUser(); if(normalizeRole(u.role)!=='ADMIN'){location.href=getDashboardPath(u.role);} initNavbar('users');
async function load(){try{const users=await apiCall('/api/users','GET',null,true); document.getElementById('users').innerHTML=`<div style="overflow:auto"><table class="data-table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Member Since</th><th>Action</th></tr></thead><tbody>${users.map(x=>`<tr><td>${x.name||''}</td><td>${x.email||''}</td><td><select onchange="changeRole(${x.id},this.value)"><option ${x.role==='CANDIDATE'?'selected':''}>CANDIDATE</option><option ${x.role==='RECRUITER'?'selected':''}>RECRUITER</option><option ${x.role==='ADMIN'?'selected':''}>ADMIN</option></select></td><td>${x.memberSince||'—'}</td><td><button class="btn btn-secondary btn-small" onclick="deleteUser(${x.id})">Delete</button></td></tr>`).join('')}</tbody></table></div>`;}catch(e){document.getElementById('users').innerHTML=`<div class="error-state">${e.message}</div>`;}}
async function changeRole(id,role){try{await apiCall('/api/users/'+id,'PUT',{role},true);showToast('Role updated.');}catch(e){showToast(e.message,'error');load();}}
async function deleteUser(id){if(!confirm('Delete this user?'))return;try{await apiCall('/api/users/'+id,'DELETE',null,true);showToast('User deleted.');load();}catch(e){showToast(e.message,'error');}}
load();</script></body></html>
